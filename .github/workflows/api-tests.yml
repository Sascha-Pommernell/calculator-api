name: Build, Docker & API-Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: API-Repo auschecken
        uses: actions/checkout@v4

      - name: Test-Repo auschecken
        uses: actions/checkout@v4
        with:
          repository: Sascha-Pommernell/calculator-api-tests-c
          path: tests-repo

      - name: API-Docker-Image bauen
        run: docker build -t calculator-api:ci .

      - name: Test-Docker-Image bauen
        run: docker build -t calculator-api-tests:ci tests-repo

      - name: Docker-Netzwerk anlegen und API starten
        run: |
          docker network create calc-net
          docker run -d --name calculator-api \
            --network calc-net \
            -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            calculator-api:ci

      - name: Auf API warten
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/openapi/v1.json > /dev/null; then
              echo "API ist erreichbar."
              exit 0
            fi
            echo "Warte auf API... ($i/30)"
            sleep 2
          done
          echo "::error::API wurde nicht rechtzeitig erreichbar."
          docker logs calculator-api
          exit 1

      - name: Tests im Docker-Container ausführen
        id: tests
        continue-on-error: true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          docker run --rm --name calculator-api-tests \
            --network calc-net \
            -e API_BASE_URL=http://calculator-api:8080 \
            -v "$GITHUB_WORKSPACE/test-results:/results" \
            calculator-api-tests:ci

      - name: API-Logs anzeigen (bei Testfehlern)
        if: steps.tests.outcome == 'failure'
        run: docker logs calculator-api

      - name: Testergebnisse als Artefakt hochladen
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testergebnisse
          path: test-results/
          if-no-files-found: warn

      - name: Allure-Historie von GitHub Pages laden
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Allure CLI installieren
        if: always()
        run: |
          ALLURE_VERSION=2.32.0
          curl -fsSLo /tmp/allure.tgz "https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/${ALLURE_VERSION}/allure-commandline-${ALLURE_VERSION}.tgz"
          sudo tar -xzf /tmp/allure.tgz -C /opt
          echo "/opt/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Allure-Report generieren
        if: always()
        run: |
          mkdir -p test-results/allure-results

          # Historie aus vorherigem Lauf (gh-pages) übernehmen
          if [ -d gh-pages/last-history ]; then
            mkdir -p test-results/allure-results/history
            cp -r gh-pages/last-history/. test-results/allure-results/history/
          fi

          allure generate --clean test-results/allure-results -o allure-report

          # allure-history aufbauen: bestehende Reports übernehmen, max. 20 behalten
          mkdir -p allure-history
          if [ -d gh-pages ]; then
            cp -r gh-pages/. allure-history/
            rm -rf allure-history/.git
          fi
          cd allure-history
          ls -d [0-9]* 2>/dev/null | sort -n | head -n -19 | xargs -r rm -rf
          cd ..

          cp -r allure-report "allure-history/${{ github.run_number }}"
          rm -rf allure-history/last-history
          cp -r allure-report/history allure-history/last-history
          printf '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=%s/">' "${{ github.run_number }}" > allure-history/index.html

      - name: Allure-Report auf GitHub Pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Workflow bei Testfehlern fehlschlagen lassen
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Mindestens ein API-Test ist fehlgeschlagen. Details im Allure-Report."
          exit 1

      - name: Aufräumen
        if: always()
        run: |
          docker rm -f calculator-api || true
          docker network rm calc-net || true
